<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programs - APK İndir</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; color:#fff;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0b0d14 url("arkaplan.png") center/cover no-repeat fixed;
    position:relative;
  }
  body::before {
    content:""; position:fixed; inset:0; z-index:0;
    background: linear-gradient(180deg, rgba(8,10,20,.65), rgba(5,6,14,.9));
  }
  body::after {
    content:""; position:fixed; width:55vmax; height:55vmax; right:-20vmax; top:-20vmax;
    background: radial-gradient(circle, rgba(106,92,255,.25), transparent 60%);
    animation: drift 14s ease-in-out infinite alternate; z-index:0; pointer-events:none;
  }
  @keyframes drift { to { transform: translate(-50vw, 40vh); } }

  .wrap { position:relative; z-index:1; max-width:760px; margin:0 auto; padding:32px 16px 60px; }
  .back { display:inline-block; color:rgba(255,255,255,.75); text-decoration:none; margin-bottom:18px;
          transition: color .2s, transform .2s; }
  .back:hover { color:#fff; transform: translateX(-4px); }

  header { text-align:center; margin-bottom:24px; animation: rise .8s cubic-bezier(.2,.8,.2,1) both; }
  h1 {
    font-size:clamp(1.8rem, 6vw, 2.4rem); margin:0 0 6px;
    background: linear-gradient(90deg, #fff, #8ec1ff, #fff); background-size:200% auto;
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    animation: shine 5s linear infinite;
  }
  @keyframes shine { to { background-position: 200% center; } }
  .sub { color:rgba(255,255,255,.7); margin:0; }

  #q {
    width:100%; padding:14px 18px; font-size:1rem; color:#fff; outline:none;
    background: rgba(20,24,38,.5); border:1px solid rgba(255,255,255,.18); border-radius:14px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    margin-bottom:18px; transition: border-color .2s, box-shadow .2s;
    animation: rise .8s .15s both;
  }
  #q::placeholder { color:rgba(255,255,255,.5); }
  #q:focus { border-color:#6aa8ff; box-shadow:0 0 0 4px rgba(79,140,255,.25); }

  .item {
    display:flex; align-items:center; gap:14px; padding:16px;
    margin-bottom:12px; border-radius:16px;
    background: rgba(20,24,38,.5); border:1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
    transition: transform .25s, border-color .25s, box-shadow .25s;
    animation: rise .7s cubic-bezier(.2,.8,.2,1) both;
  }
  .item:hover { transform: translateY(-4px) scale(1.015); border-color:rgba(142,193,255,.6);
                box-shadow: 0 14px 34px rgba(79,110,255,.35); }
  @keyframes rise { from { opacity:0; transform: translateY(30px); } }

  .badge {
    flex:none; width:48px; height:48px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:.8rem; letter-spacing:.5px;
    background: linear-gradient(135deg, rgba(47,128,237,.35), rgba(106,92,255,.35));
    border:1px solid rgba(255,255,255,.2); transition: transform .3s;
  }
  .item:hover .badge { transform: rotate(-8deg) scale(1.12); }
  .info { flex:1; min-width:0; }
  .name { font-weight:700; word-break:break-all; }
  .meta { color:rgba(255,255,255,.6); font-size:.85rem; margin-top:3px; }

  .btn {
    position:relative; overflow:hidden; white-space:nowrap;
    color:#fff; text-decoration:none; font-weight:700; padding:11px 22px; border-radius:11px;
    background: linear-gradient(135deg, #2f80ed, #6a5cff);
    box-shadow: 0 6px 18px rgba(79,110,255,.45); transition: transform .2s, box-shadow .2s;
  }
  .btn::after {
    content:""; position:absolute; top:0; left:-120%; width:60%; height:100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,.45), transparent);
    transform: skewX(-20deg); transition: left .6s;
  }
  .btn:hover { transform: scale(1.07); box-shadow: 0 10px 26px rgba(79,110,255,.7); }
  .btn:hover::after { left:140%; }
  .btn:active { transform: scale(.96); }

  .empty { text-align:center; color:rgba(255,255,255,.7); padding:50px 0; animation: rise .8s both; }

  @media (max-width:520px) {
    .item { flex-wrap:wrap; }
    .btn { width:100%; text-align:center; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./">&larr; Ana sayfa</a>

  <header>
    <h1>Programs</h1>
    <p class="sub" id="count"></p>
  </header>

  <input id="q" type="search" placeholder="Ara..." hidden>
  <div id="list"></div>
</div>

<script>
  // ============================================================
  //  Bu sayfa APK'ları GitHub Release'lerinden OTOMATİK çeker.
  //  Yeni APK eklemek için sadece Release'e yükle, kod değiştirme.
  //  Repo adın farklıysa sadece aşağıdaki iki satırı düzelt.
  // ============================================================
  const KULLANICI = 'selimozturkk';
  const REPO      = 'selimozturkk.github.io';
  // ============================================================

  const list  = document.getElementById('list');
  const q     = document.getElementById('q');
  const count = document.getElementById('count');

  function fmtSize(b) {
    if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MB';
    if (b >= 1024) return Math.round(b / 1024) + ' KB';
    return b + ' B';
  }
  function fmtDate(s) {
    const d = new Date(s);
    return String(d.getDate()).padStart(2, '0') + '.' +
           String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear();
  }
  function message(text) {
    list.innerHTML = '';
    const m = document.createElement('div');
    m.className = 'empty';
    m.textContent = text;
    list.appendChild(m);
  }

  function render(apks) {
    count.textContent = apks.length + ' APK dosyası';
    if (apks.length === 0) { message('Henüz APK eklenmemiş.'); return; }
    q.hidden = false;
    list.innerHTML = '';
    apks.forEach((a, i) => {
      const item = document.createElement('div');
      item.className = 'item';
      item.style.animationDelay = (0.25 + i * 0.08) + 's';
      item.dataset.name = a.name.toLowerCase();

      const badge = document.createElement('div');
      badge.className = 'badge';
      badge.textContent = 'APK';

      const info = document.createElement('div');
      info.className = 'info';
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = a.name;
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = fmtSize(a.size) + ' \u2022 ' + fmtDate(a.date);
      info.append(name, meta);

      const btn = document.createElement('a');
      btn.className = 'btn';
      btn.href = a.url;
      btn.rel = 'noopener';
      btn.textContent = '\u0130ndir';

      item.append(badge, info, btn);
      list.appendChild(item);
    });
  }

  q.addEventListener('input', () => {
    const v = q.value.toLowerCase();
    list.querySelectorAll('.item').forEach(el => {
      el.style.display = el.dataset.name.includes(v) ? '' : 'none';
    });
  });

  // GitHub'ın istek sınırına takılmamak için sonucu 5 dakika saklıyoruz
  const CACHE_KEY = 'apk-cache-v1';
  const CACHE_MS  = 5 * 60 * 1000;

  function readCache() {
    try {
      const c = JSON.parse(localStorage.getItem(CACHE_KEY));
      if (c && Date.now() - c.t < CACHE_MS) return c.data;
    } catch (e) {}
    return null;
  }
  function writeCache(data) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), data })); } catch (e) {}
  }

  async function load() {
    const cached = readCache();
    if (cached) { render(cached); return; }

    message('Yükleniyor...');
    try {
      const r = await fetch('https://api.github.com/repos/' + KULLANICI + '/' + REPO + '/releases?per_page=100');
      if (!r.ok) throw new Error(r.status);
      const releases = await r.json();

      const apks = [];
      releases.forEach(rel => {
        if (rel.draft) return;
        (rel.assets || []).forEach(as => {
          if (as.name.toLowerCase().endsWith('.apk')) {
            apks.push({
              name: as.name,
              size: as.size,
              date: as.updated_at || rel.published_at,
              url:  as.browser_download_url
            });
          }
        });
      });
      apks.sort((a, b) => new Date(b.date) - new Date(a.date));
      writeCache(apks);
      render(apks);
    } catch (e) {
      count.textContent = '';
      message('Liste şu an yüklenemedi, biraz sonra tekrar dene.');
    }
  }
  load();
</script>
</body>
</html>
